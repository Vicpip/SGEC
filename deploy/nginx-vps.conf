# SGEC — plantilla del Nginx del HOST (fuera de Docker), que termina TLS y hace de proxy
# inverso hacia los contenedores. Es una plantilla genérica: sustituye <tu-dominio> y
# cópiala a /etc/nginx/sites-available/sgec (ver DEPLOY.md).
#
# Este bloque escucha en el puerto 80. Certbot (`certbot --nginx -d <tu-dominio>`) agrega
# después el bloque 443 con los certificados y la redirección de HTTP a HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name <tu-dominio>;

    # Una actividad admite hasta 10 adjuntos de MAX_FILE_SIZE_MB (20 MB) cada uno. Con el
    # valor por defecto de Nginx (1 MB) cualquier archivo mediano responde 413.
    client_max_body_size 200m;

    # ── API (contenedor `server`, publicado solo en 127.0.0.1:3001) ──────────
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Node confía en UN proxy (TRUST_PROXY=1) y toma la última dirección de esta
        # cabecera como IP del cliente: es la que agrega este Nginx, no una que el cliente
        # pueda falsear. Sin esta línea, todos los usuarios compartirían el mismo límite de
        # inicios de sesión.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # ── Frontend (contenedor `client`, publicado solo en 127.0.0.1:4000) ─────
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
