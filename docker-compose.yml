# SGEC — archivo base: PRODUCCIÓN, detrás del Nginx del host (ver DEPLOY.md).
#
# Puertos:
#   - client → 4000 del host. El Nginx del host hace proxy de "/" hacia aquí.
#   - server → 3001, publicado SOLO en 127.0.0.1: el Nginx del host hace proxy de "/api"
#     hacia ahí, pero desde fuera de la máquina no se puede llegar directo a Node.
#   - db     → sin puertos publicados.
#
# Desarrollo local con Docker (puertos 80 y 3001 abiertos): este archivo MÁS el local, de
# forma explícita. No existe un docker-compose.override.yml a propósito, porque Compose lo
# aplicaría solo y también se aplicaría en el servidor.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Datos iniciales: la base arranca vacía (solo el esquema). El Administrador se crea con
# server/db/create_admin.js; los seeds de demo se cargan únicamente con SEED_DEMO=true.

services:
  # ── Base de datos MySQL ───────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: sgec_db
    restart: always
    # Hora del centro de México, fija en UTC-06:00 (ver server/src/config/zonaHoraria.js).
    command: ["--default-time-zone=-06:00"]
    environment:
      TZ: America/Mexico_City
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: sgec
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sgec_db_data:/var/lib/mysql
      # Solo se ejecuta la primera vez que se crea el volumen. Una base que ya existe se
      # actualiza con las migraciones de server/db/migrations/ (ver docs/DEPLOYMENT.md).
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - sgec_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Node.js + Express ─────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sgec_server
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
      TZ: America/Mexico_City
      # Un proxy inverso delante de Node (el Nginx del host): los límites de peticiones
      # cuentan por la IP real del cliente.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: sgec
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS}
      CLIENT_URL: ${CLIENT_URL}
      # Correo saliente (opcional): sin SMTP_HOST el servidor no envía nada.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_DRY_RUN: ${EMAIL_DRY_RUN:-false}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - sgec_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sgec_net

  # ── Frontend React + Vite (build estático servido por Nginx interno) ──
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: sgec_client
    restart: always
    ports:
      - "4000:80"
    networks:
      - sgec_net

networks:
  sgec_net:
    driver: bridge

volumes:
  sgec_db_data:
  sgec_uploads:
